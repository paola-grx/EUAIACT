# Render Blueprint: FREE demo instance (web app + database, Frankfurt), for trying the app.
# In Render: New > Blueprint > this repository, and set the Blueprint path to "render-free.yaml".
# See docs/deploy-render.md ("Free demo").
#
# Free-plan limits: the web service sleeps after ~15 minutes without traffic (the next visit
# takes about a minute), the free database expires after a trial period, and there are no free
# cron jobs (run the refresh cycle from Settings in the app instead).
# EUAIACT_DEMO=1 fills the empty database with fictional sample data and shows a banner.
# Do NOT enter real personal data into a demo instance.

services:
  - type: web
    name: euaiact-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: EUAIACT_ENV
        value: production
      - key: EUAIACT_DEMO
        value: "1"
      - key: EUAIACT_SECRET_KEY
        generateValue: true
      - key: EUAIACT_DATABASE_URL
        fromDatabase:
          name: euaiact-demo-db
          property: connectionString
      # EUAIACT_BASE_URL is not needed: the app uses Render's RENDER_EXTERNAL_URL.

databases:
  - name: euaiact-demo-db
    databaseName: euaiact
    user: euaiact
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
