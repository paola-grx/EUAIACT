# Production-style stack: app + PostgreSQL + daily refresh/reminder job.
# Copy .env.example to .env and fill in the values first.
# Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik, a load balancer) in front of port 8000.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: euaiact
      POSTGRES_USER: euaiact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euaiact"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      EUAIACT_ENV: production
      EUAIACT_DATABASE_URL: postgresql+psycopg://euaiact:${POSTGRES_PASSWORD}@db/euaiact
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      EUAIACT_ENV: production
      EUAIACT_DATABASE_URL: postgresql+psycopg://euaiact:${POSTGRES_PASSWORD}@db/euaiact
    # Refresh cycle + reminder e-mails once a day.
    entrypoint: ["sh", "-c", "while true; do python -m euaiact.cli refresh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
